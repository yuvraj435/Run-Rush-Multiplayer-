<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Run Rush — Mini Runner Game</title>
<style>
  :root { --ink:#f6f7fb; --muted:#aeb8d0; --panel:#141b30; --accent:#76f7c5; }
  * { box-sizing:border-box; }
  body {
    margin:0; min-height:100vh; display:grid; place-items:center; padding:20px;
    color:var(--ink); font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    background:radial-gradient(circle at 20% 0%,#263b68 0,#11172a 48%,#090d18 100%);
  }
  .wrap { width:min(920px,100%); }
  header { display:flex; justify-content:space-between; align-items:center; gap:16px; margin-bottom:14px; }
  .eyebrow { color:var(--accent); text-transform:uppercase; letter-spacing:.18em; font-size:.72rem; font-weight:800; }
  h1 { margin:4px 0 0; font-size:clamp(1.8rem,5vw,3rem); letter-spacing:-.04em; }
  .scorebox { display:flex; gap:10px; }
  .pill { background:#ffffff12; border:1px solid #ffffff20; border-radius:14px; padding:10px 14px; min-width:88px; text-align:center; }
  .pill span { display:block; font-size:.7rem; color:var(--muted); text-transform:uppercase; letter-spacing:.1em; }
  .pill strong { font-size:1.15rem; }
  .mp-panel { margin:0 0 14px; padding:16px; border:1px solid #ffffff26; border-radius:18px; background:#141b30cc; }
  .mp-top,.mp-actions,.mp-join { display:flex; align-items:center; justify-content:space-between; gap:9px; flex-wrap:wrap; }
  .mp-label { color:var(--accent); font-size:.68rem; letter-spacing:.14em; font-weight:800; margin-bottom:4px; }
  #connectionStatus { font-size:.9rem; }
  .mp-join { margin-top:12px; justify-content:flex-start; }
  .mp-panel input { min-width:0; width:130px; padding:10px 12px; border-radius:10px; border:1px solid #ffffff2a; background:#0b1224; color:white; font:inherit; }
  #roomCode { width:125px; text-transform:uppercase; letter-spacing:.12em; }
  .small-btn { padding:10px 14px; font-size:.83rem; box-shadow:none; }
  .small-btn:active { box-shadow:none; }
  .small-btn.secondary { color:var(--ink); background:#ffffff14; border:1px solid #ffffff25; }
  .small-btn:disabled { opacity:.45; cursor:not-allowed; }
  .room-info { color:var(--muted); font-size:.83rem; margin-top:10px; }
  .players-list { display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; }
  .player-chip { padding:7px 10px; border-radius:10px; background:#ffffff10; font-size:.82rem; }
  .player-chip b { color:var(--accent); }
  .game-shell { position:relative; overflow:hidden; border:1px solid #ffffff26; border-radius:22px; box-shadow:0 24px 70px #0008; background:#121d36; }
  canvas { display:block; width:100%; height:auto; aspect-ratio: 16 / 8; touch-action:manipulation; }
  .game-shell { background:#050817; }
  .game-hud { position:absolute; left:12px; top:10px; z-index:1; color:#bdfcff; font-size:.72rem; letter-spacing:.12em; text-shadow:0 0 10px #00eaff; pointer-events:none; }
  .overlay { position:absolute; inset:0; display:grid; place-items:center; padding:20px; text-align:center; background:#0911269c; backdrop-filter:blur(5px); }
  .overlay.hidden { display:none; }
  .modal { max-width:420px; }
  .modal h2 { font-size:clamp(1.7rem,5vw,2.6rem); margin:0 0 8px; }
  .modal p { color:#d0d7e9; line-height:1.55; margin:0 0 18px; }
  button { border:0; cursor:pointer; font:inherit; font-weight:800; border-radius:999px; padding:12px 22px; color:#092018; background:var(--accent); box-shadow:0 7px 0 #39b98d; }
  button:active { transform:translateY(3px); box-shadow:0 4px 0 #39b98d; }
  .below { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px; padding:15px 4px 0; color:var(--muted); font-size:.9rem; }
  .jump { color:var(--ink); background:#ffffff12; border:1px solid #ffffff20; border-radius:12px; padding:9px 13px; }
  @media(max-width:520px) { body{padding:12px} header{align-items:flex-start;flex-direction:column}.scorebox{width:100%}.pill{flex:1} canvas{aspect-ratio:4/3} .below{font-size:.82rem} }
</style>
</head>
<body>
<main class="wrap">
  <header>
    <div><div class="eyebrow">A tiny arcade game</div><h1>RUN <span style="color:var(--accent)">RUSH</span></h1></div>
    <div class="scorebox">
      <div class="pill"><span>Score</span><strong id="score">0</strong></div>
      <div class="pill"><span>Best</span><strong id="best">0</strong></div>
    </div>
  </header>
  <section class="mp-panel" aria-label="Online multiplayer">
    <div class="mp-top">
      <div><div class="mp-label">ONLINE MULTIPLAYER</div><strong id="connectionStatus">Connecting…</strong></div>
      <div class="mp-actions"><input id="playerName" maxlength="16" placeholder="Your name" value="Runner" aria-label="Your player name"><button id="createRoom" class="small-btn">Create room</button></div>
    </div>
    <div class="mp-join">
      <input id="roomCode" maxlength="6" placeholder="ROOM CODE" aria-label="Room code">
      <button id="joinRoom" class="small-btn secondary">Join room</button>
      <button id="copyRoom" class="small-btn secondary" disabled>Copy invite</button>
    </div>
    <div id="roomInfo" class="room-info">Create a room and share its code with a friend.</div>
    <div id="playersList" class="players-list"></div>
  </section>
  <section class="game-shell" aria-label="Run Rush game">
    <div class="game-hud">NEON CIRCUIT · 3D RACE</div>
    <canvas id="game" width="960" height="480" aria-label="3D runner game. Tap, click, or press space to jump."></canvas>
    <div class="overlay" id="overlay">
      <div class="modal">
        <div style="font-size:3rem;margin-bottom:8px">🏃</div>
        <h2 id="overlayTitle">Ready, runner?</h2>
        <p id="overlayText">Jump over the blocks, keep running, and see how high you can score.</p>
        <button id="startBtn">Start running</button>
      </div>
    </div>
  </section>
  <div class="below">
    <span>Controls: <b>Space</b> / <b>↑</b> / tap to jump</span>
    <span class="jump">Tip: time your jumps!</span>
  </div>
</main>
<script src="/socket.io/socket.io.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
(() => {
  const socket = (typeof io === 'function') ? io() : null;
  const statusEl = document.getElementById('connectionStatus');
  const roomCodeEl = document.getElementById('roomCode');
  const nameEl = document.getElementById('playerName');
  const roomInfoEl = document.getElementById('roomInfo');
  const playersEl = document.getElementById('playersList');
  const copyBtn = document.getElementById('copyRoom');
  let activeRoom = '';
  let currentPlayers = [];
  const remoteMotion = new Map();
  function showStatus(text) { statusEl.textContent = text; }
  function emitRoom(action) {
    if (!socket) { showStatus('Server connection unavailable'); roomInfoEl.textContent = 'Open this game from the hosted server URL, not as a downloaded file.'; return; }
    const name = (nameEl.value.trim() || 'Runner').slice(0,16);
    socket.emit(action, { roomCode: roomCodeEl.value.trim().toUpperCase(), name });
  }
  document.getElementById('createRoom').addEventListener('click', () => emitRoom('create-room'));
  document.getElementById('joinRoom').addEventListener('click', () => emitRoom('join-room'));
  roomCodeEl.addEventListener('input', () => roomCodeEl.value = roomCodeEl.value.toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,6));
  copyBtn.addEventListener('click', async () => {
    if (!activeRoom) return;
    const invite = location.origin + location.pathname + '?room=' + activeRoom;
    try { await navigator.clipboard.writeText(invite); roomInfoEl.textContent = 'Invite link copied! Send it to your friend.'; }
    catch(e) { roomInfoEl.textContent = 'Room code: ' + activeRoom + ' — share this code with your friend.'; }
  });
  const params = new URLSearchParams(location.search);
  if (params.get('room')) roomCodeEl.value = params.get('room').toUpperCase().slice(0,6);
  if (socket) {
    socket.on('connect', () => showStatus('Connected to multiplayer server'));
    socket.on('disconnect', () => showStatus('Disconnected — reconnecting…'));
    socket.on('room-created', data => {
      activeRoom = data.roomCode; roomCodeEl.value = activeRoom; copyBtn.disabled = false;
      roomInfoEl.textContent = 'Room created! Share the code or invite link with a friend.';
    });
    socket.on('room-joined', data => {
      activeRoom = data.roomCode; roomCodeEl.value = activeRoom; copyBtn.disabled = false;
      roomInfoEl.textContent = 'Joined room ' + activeRoom + '. Start running and race your friend!';
      renderPlayers(data.players || []);
    });
    socket.on('room-update', data => {
      activeRoom = data.roomCode; renderPlayers(data.players || []);
      if (data.roundComplete) showWaitingRoom(data.readyCount || 0, (data.players || []).length);
      else roomInfoEl.textContent = 'Room ' + activeRoom + ' · ' + (data.players || []).length + ' player(s) connected.';
    });
    socket.on('round-complete', data => showWaitingRoom(0, (data.players || []).length));
    socket.on('next-race-start', data => {
      renderPlayers(data.players || []);
      remoteMotion.clear();
      reset();
      titleEl.textContent = 'Ready, runners!';
      roomInfoEl.textContent = 'Everyone is ready. The new race has started!';
    });
    socket.on('room-error', msg => { roomInfoEl.textContent = msg; });
    socket.on('player-state', data => {
      const p = currentPlayers.find(x => x.id === data.id);
      if (p) { p.score = data.score; p.alive = data.alive; renderPlayers(currentPlayers); }
    });
    socket.on('player-motion', data => {
      remoteMotion.set(data.id, {
        jump: Math.max(0, Math.min(1, Number(data.jump) || 0)),
        running: !!data.running,
        score: Number(data.score) || 0,
        receivedAt: performance.now()
      });
      const p = currentPlayers.find(x => x.id === data.id);
      if (p) { p.score = Number(data.score) || p.score; }
    });
  }
  function renderPlayers(players) {
    currentPlayers = players;
    playersEl.innerHTML = '';
    players.forEach(p => {
      const chip = document.createElement('div'); chip.className = 'player-chip';
      const label = document.createElement('span'); label.textContent = p.name + (p.id === (socket && socket.id) ? ' (you)' : '');
      const score = document.createElement('b'); score.textContent = ' · ' + (p.score || 0) + ' pts';
      const state = document.createElement('span'); state.textContent = p.alive === false ? (p.ready ? ' · Ready' : ' · Finished') : ' · Running';
      chip.append(label, score, state); playersEl.appendChild(chip);
    });
  }
  function showWaitingRoom(readyCount, total) {
    running = false; gameOver = true;
    titleEl.textContent = 'Race finished!';
    textEl.textContent = `Everyone has finished. ${readyCount} of ${total} players ready for the next race.`;
    startBtn.textContent = 'Play Again';
    startBtn.disabled = false;
    startBtn.onclick = () => {
      if (socket && activeRoom) {
        startBtn.disabled = true;
        titleEl.textContent = 'Waiting for everyone…';
        textEl.textContent = 'You are ready! The next race starts when all players press Play Again.';
        socket.emit('ready-next-race', { roomCode: activeRoom });
      } else {
        reset();
      }
    };
    overlay.classList.remove('hidden');
  }
  const reportState = (score, alive) => {
    if (socket && activeRoom) socket.emit('game-state', { roomCode: activeRoom, score: Math.floor(score), alive });
  };
  let lastMotionSent = 0;
  function sendMotion(now) {
    if (!socket || !activeRoom || !running || now - lastMotionSent < 100) return;
    lastMotionSent = now;
    const jump = Math.max(0, Math.min(1, (ground - player.h - player.y) / 110));
    socket.emit('player-motion', { roomCode: activeRoom, jump, running, score: Math.floor(score) });
  }

  const canvas = document.getElementById('game');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const overlay = document.getElementById('overlay');
  const titleEl = document.getElementById('overlayTitle');
  const textEl = document.getElementById('overlayText');
  const startBtn = document.getElementById('startBtn');
  const W = canvas.width, H = canvas.height, ground = 385;
  let running = false, gameOver = false, score = 0, best = 0, speed = 6, frame = 0;
  let lastSoloMessageIndex = -1;

  // 3D neon circuit. Game scoring and collision calculations below remain the original rules.
  let scene, camera, renderer, worldClock;
  let localRunner, remoteRunners = new Map(), obstacleMeshes = new Map();
  let roadMarks = [], cityBlocks = [], threeReady = false;
  const runnerColors = [0x32f5ff, 0xff4de1, 0xa4ff4d, 0xffb347, 0x9d7bff, 0xff6688, 0x54ffd0, 0xffffff];

  function makeRunner(color, isLocal) {
    const group = new THREE.Group();
    const suit = new THREE.MeshStandardMaterial({ color, metalness: 0.72, roughness: 0.22, emissive: color, emissiveIntensity: 0.38 });
    const dark = new THREE.MeshStandardMaterial({ color: 0x10172b, metalness: 0.65, roughness: 0.28 });
    const glow = new THREE.MeshStandardMaterial({ color: 0x8fffff, emissive: 0x00dfff, emissiveIntensity: 1.5 });
    const body = new THREE.Mesh(new THREE.CapsuleGeometry(0.34, 0.72, 5, 10), suit);
    body.position.y = 1.18; group.add(body);
    const head = new THREE.Mesh(new THREE.SphereGeometry(0.27, 16, 12), dark);
    head.position.y = 1.92; group.add(head);
    const visor = new THREE.Mesh(new THREE.BoxGeometry(0.38, 0.11, 0.12), glow);
    visor.position.set(0, 1.96, 0.22); group.add(visor);
    const chest = new THREE.Mesh(new THREE.BoxGeometry(0.42, 0.12, 0.12), glow);
    chest.position.set(0, 1.38, 0.32); group.add(chest);
    const limbGeo = new THREE.CylinderGeometry(0.085, 0.11, 0.65, 8);
    const arms = [], legs = [];
    for (const side of [-1, 1]) {
      const arm = new THREE.Mesh(limbGeo, dark);
      arm.position.set(side * 0.43, 1.25, 0); group.add(arm); arms.push(arm);
      const leg = new THREE.Mesh(limbGeo, suit);
      leg.position.set(side * 0.16, 0.48, 0); group.add(leg); legs.push(leg);
      const boot = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.12, 0.34), glow);
      boot.position.set(side * 0.16, 0.12, 0.08); group.add(boot);
    }
    const aura = new THREE.PointLight(color, isLocal ? 1.1 : 0.55, 4);
    aura.position.set(0, 1.3, 0); group.add(aura);
    group.userData = { arms, legs, isLocal };
    return group;
  }

  function initThree() {
    if (!window.THREE) {
      roomInfoEl.textContent = '3D graphics could not load. Check your internet connection and reload.';
      return;
    }
    try {
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x050817);
      scene.fog = new THREE.Fog(0x050817, 18, 72);
      camera = new THREE.PerspectiveCamera(55, 2, 0.1, 120);
      camera.position.set(0, 8.5, 13.5);
      camera.lookAt(0, 1.0, -8);
      renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));
      renderer.setSize(canvas.clientWidth || 960, canvas.clientHeight || 480, false);
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      worldClock = new THREE.Clock();

      scene.add(new THREE.HemisphereLight(0x9ecbff, 0x111020, 1.35));
      const key = new THREE.DirectionalLight(0xffffff, 2.0);
      key.position.set(-5, 12, 7); key.castShadow = true; scene.add(key);
      const cyanLight = new THREE.PointLight(0x00dfff, 24, 32); cyanLight.position.set(-7, 5, -10); scene.add(cyanLight);
      const pinkLight = new THREE.PointLight(0xff19cf, 18, 28); pinkLight.position.set(8, 4, -18); scene.add(pinkLight);

      const floor = new THREE.Mesh(new THREE.PlaneGeometry(90, 100), new THREE.MeshStandardMaterial({ color: 0x080d1c, metalness: 0.45, roughness: 0.65 }));
      floor.rotation.x = -Math.PI / 2; floor.position.set(0, -0.13, -25); floor.receiveShadow = true; scene.add(floor);
      const road = new THREE.Mesh(new THREE.PlaneGeometry(13.5, 90), new THREE.MeshStandardMaterial({ color: 0x10182b, metalness: 0.55, roughness: 0.38 }));
      road.rotation.x = -Math.PI / 2; road.position.set(0, -0.04, -24); road.receiveShadow = true; scene.add(road);

      for (const x of [-6.8, 6.8, -2.25, 2.25]) {
        const rail = new THREE.Mesh(new THREE.BoxGeometry(0.055, 0.08, 90), new THREE.MeshStandardMaterial({ color: 0x00dfff, emissive: 0x00bfff, emissiveIntensity: 1.8 }));
        rail.position.set(x, 0.03, -24); scene.add(rail);
      }
      for (let i = 0; i < 24; i++) {
        const mark = new THREE.Mesh(new THREE.BoxGeometry(0.055, 0.025, 1.25), new THREE.MeshBasicMaterial({ color: i % 2 ? 0x00dfff : 0xff29d7 }));
        mark.position.set(i % 2 ? -2.25 : 2.25, 0.02, 5 - i * 4);
        scene.add(mark); roadMarks.push(mark);
      }
      for (let i = 0; i < 26; i++) {
        for (const side of [-1, 1]) {
          const h = 3 + Math.random() * 13, w = 1.4 + Math.random() * 2.8;
          const mat = new THREE.MeshStandardMaterial({ color: side < 0 ? 0x111c3d : 0x241139, metalness: 0.6, roughness: 0.4, emissive: side < 0 ? 0x062c52 : 0x38072f, emissiveIntensity: 0.5 });
          const building = new THREE.Mesh(new THREE.BoxGeometry(w, h, 2 + Math.random() * 3), mat);
          building.position.set(side * (9 + Math.random() * 7), h / 2 - 0.1, -i * 4 - 8);
          scene.add(building); cityBlocks.push(building);
          const strip = new THREE.Mesh(new THREE.BoxGeometry(0.045, h * 0.72, 0.05), new THREE.MeshBasicMaterial({ color: side < 0 ? 0x00dfff : 0xff26cf }));
          strip.position.set(building.position.x - side * (w * 0.28), h * 0.48, building.position.z + 1.52);
          scene.add(strip);
        }
      }
      localRunner = makeRunner(0x32f5ff, true);
      localRunner.position.set(0, 0, 2.0); scene.add(localRunner);
      threeReady = true;
      resizeThree();
    } catch (err) {
      console.error('3D initialization failed:', err);
      roomInfoEl.textContent = 'This browser could not start 3D graphics. Try a recent version of Chrome.';
    }
  }

  function resizeThree() {
    if (!renderer || !camera) return;
    const width = canvas.clientWidth || 960;
    const height = canvas.clientHeight || 480;
    renderer.setSize(width, height, false);
    camera.aspect = width / height;
    camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', resizeThree);

  function syncRemoteRunners() {
    if (!threeReady) return;
    const visible = new Set();
    const players = currentPlayers.filter(p => p.id !== (socket && socket.id));
    players.forEach((p, index) => {
      visible.add(p.id);
      let avatar = remoteRunners.get(p.id);
      if (!avatar) {
        avatar = makeRunner(runnerColors[(index + 1) % runnerColors.length], false);
        scene.add(avatar); remoteRunners.set(p.id, avatar);
      }
      const lane = Number.isFinite(p.lane) ? p.lane : index + 1;
      const laneX = (lane - (currentPlayers.length - 1) / 2) * 1.65;
      avatar.position.x = laneX;
      const motion = remoteMotion.get(p.id);
      const jump = motion ? motion.jump : (p.jump || 0);
      avatar.position.y = jump * 2.1;
      avatar.visible = true;
    });
    for (const [id, avatar] of remoteRunners) {
      if (!visible.has(id)) { scene.remove(avatar); remoteRunners.delete(id); remoteMotion.delete(id); }
    }
  }

  function animateRunner(group, time, isRunning) {
    if (!group) return;
    const swing = isRunning ? Math.sin(time * 12) * 0.62 : 0;
    group.userData.legs.forEach((leg, i) => { leg.rotation.x = i === 0 ? swing : -swing; });
    group.userData.arms.forEach((arm, i) => { arm.rotation.x = i === 0 ? -swing * 0.75 : swing * 0.75; });
    group.position.y += isRunning ? Math.abs(Math.sin(time * 12)) * 0.025 : 0;
  }

  function localLaneX() {
    if (currentPlayers.length <= 1) return 0;
    const me = currentPlayers.find(p => p.id === (socket && socket.id));
    const lane = me && Number.isFinite(me.lane) ? me.lane : 0;
    return (lane - (currentPlayers.length - 1) / 2) * 1.65;
  }

  function renderThree() {
    if (!threeReady) return;
    const t = worldClock.getElapsedTime();
    roadMarks.forEach(mark => {
      mark.position.z += running ? speed * delta * 0.12 : 0.015;
      if (mark.position.z > 7) mark.position.z -= 96;
    });
    if (localRunner) {
      localRunner.position.x = localLaneX();
      localRunner.position.y = Math.max(0, (ground - player.h - player.y) / 30);
      animateRunner(localRunner, t, running && player.onGround);
    }
    syncRemoteRunners();
    for (const p of currentPlayers) {
      const avatar = remoteRunners.get(p.id);
      if (avatar) animateRunner(avatar, t + (p.lane || 0) * 0.2, p.alive !== false);
    }
    const activeIds = new Set();
    obstacles.forEach((o, i) => {
      const id = o._threeId || (o._threeId = 'obs-' + i + '-' + Math.round(o.x));
      activeIds.add(id);
      let mesh = obstacleMeshes.get(id);
      if (!mesh) {
        const group = new THREE.Group();
        const mat = new THREE.MeshStandardMaterial({ color: 0x291044, metalness: 0.5, roughness: 0.25, emissive: 0xff19d7, emissiveIntensity: 1.6 });
        const core = new THREE.Mesh(new THREE.BoxGeometry(1.05, 1.35, 0.85), mat);
        core.position.y = 0.72; core.castShadow = true; group.add(core);
        const edgeMat = new THREE.MeshBasicMaterial({ color: 0x8fffff });
        for (const x of [-0.56, 0.56]) {
          const edge = new THREE.Mesh(new THREE.BoxGeometry(0.07, 1.48, 0.92), edgeMat);
          edge.position.set(x, 0.72, 0); group.add(edge);
        }
        scene.add(group); mesh = group; obstacleMeshes.set(id, mesh);
      }
      mesh.position.set(localLaneX(), 0, 2 - (o.x - player.x) * 0.0435);
      mesh.rotation.y = Math.sin(t * 2 + i) * 0.04;
    });
    for (const [id, mesh] of obstacleMeshes) {
      if (!activeIds.has(id)) { scene.remove(mesh); obstacleMeshes.delete(id); }
    }
    renderer.render(scene, camera);
  }

  // Scale game physics by elapsed time so different phone refresh rates play at the same speed.
  let lastTimestamp = 0, delta = 1, lastObstacleFrame = 0;
  let obstacles = [], particles = [], clouds = [];
  const player = { x:130, y:ground-58, w:42, h:58, vy:0, onGround:true };
  try { best = Number(localStorage.getItem('runrush-best') || 0); } catch(e) {}
  bestEl.textContent = best;
  for(let i=0;i<6;i++) clouds.push({x:i*190+30,y:45+Math.random()*120,s:.65+Math.random()*.8});
  function reset() {
    score=0; speed=6; frame=0; lastObstacleFrame=0; obstacles=[]; particles=[]; startBtn.disabled=false; startBtn.textContent='Start running'; startBtn.onclick=null;
    player.y=ground-player.h; player.vy=0; player.onGround=true;
    scoreEl.textContent='0'; gameOver=false; running=true;
    if (socket && activeRoom) socket.emit('player-motion', { roomCode: activeRoom, jump: 0, running: true, score: 0 });
    overlay.classList.add('hidden');
  }
  function jump() {
    if (!running) { if (!gameOver) reset(); else reset(); return; }
    if (player.onGround) { player.vy=-15.5; player.onGround=false; burst(player.x+20,player.y+player.h,7); }
  }
  startBtn.addEventListener('click', () => { if (!activeRoom) reset(); else if (!gameOver) reset(); });
  canvas.addEventListener('pointerdown', e => { e.preventDefault(); jump(); });
  document.addEventListener('keydown', e => {
    if (['Space','ArrowUp','KeyW'].includes(e.code)) { e.preventDefault(); if(e.repeat)return; if(!running) { if(gameOver) reset(); else reset(); } else jump(); }
  });
  function burst(x,y,n) { for(let i=0;i<n;i++) particles.push({x,y,vx:(Math.random()-.5)*4,vy:-Math.random()*3,life:20+Math.random()*10}); }
  function endGame() {
    running=false; gameOver=true; reportState(score,false);
    if (socket && activeRoom) socket.emit('player-motion', { roomCode: activeRoom, jump: 0, running: false, score: Math.floor(score) });
    best=Math.max(best,Math.floor(score));
    bestEl.textContent=best;
    try { localStorage.setItem('runrush-best',best); } catch(e) {}
    titleEl.textContent='Run over!';
    if (socket && activeRoom) {
      textEl.textContent=`You scored ${Math.floor(score)} points. Waiting for the other players to finish…`;
      startBtn.textContent='Waiting for players…';
      startBtn.disabled = true;
      startBtn.onclick = null;
    } else {
      const soloMessages = [
        'Great run! Ready for another?',
        'Can you beat your best score this time?',
        'Another race, another chance to shine!',
        'Keep going, runner! The track is yours!',
        'Nice effort! Let’s see what you can do next!',
        'The next run could be your best one yet!',
        'Stay sharp and keep rushing!',
        'Challenge yourself and chase a new high score!',
        'You’ve got this! Ready to run again?',
        'Every run makes you stronger. Go again!'
      ];
      let messageIndex = Math.floor(Math.random() * soloMessages.length);
      if (soloMessages.length > 1 && messageIndex === lastSoloMessageIndex) {
        messageIndex = (messageIndex + 1 + Math.floor(Math.random() * (soloMessages.length - 1))) % soloMessages.length;
      }
      lastSoloMessageIndex = messageIndex;
      textEl.textContent = `You scored ${Math.floor(score)} points. ${soloMessages[messageIndex]}`;
      startBtn.textContent='Run again';
      startBtn.disabled=false;
    }
    overlay.classList.remove('hidden');
  }
  function loop(timestamp = 0) {
    // delta=1 is one 60 Hz frame. Cap large gaps (e.g. switching tabs) to avoid sudden jumps.
    delta = lastTimestamp ? Math.min((timestamp - lastTimestamp) / (1000 / 60), 2) : 1;
    lastTimestamp = timestamp;
    sendMotion(timestamp);
    if(running) {
      frame += delta;
      score += .12 * delta;
      speed=Math.min(12,6+score/150);
      scoreEl.textContent=Math.floor(score);
      if(Math.floor(frame / 6) !== Math.floor((frame-delta) / 6)) reportState(score,true);
      player.vy += .72 * delta;
      player.y += player.vy * delta;
      if(player.y >= ground-player.h) { player.y=ground-player.h; player.vy=0; player.onGround=true; }
      const spawnEvery = Math.max(42,Math.floor(95-speed*3));
      if(frame - lastObstacleFrame >= spawnEvery) { spawnObstacle(); lastObstacleFrame = frame; }
      obstacles.forEach(o=>o.x-=speed*delta);
      obstacles=obstacles.filter(o=>o.x+o.w>-10);
      for(const o of obstacles) {
        if(player.x+player.w-7>o.x && player.x+7<o.x+o.w && player.y+player.h-4>o.y) { endGame(); break; }
      }
      particles.forEach(p=>{p.x+=p.vx*delta;p.y+=p.vy*delta;p.vy+=.12*delta;p.life-=delta;});
      particles=particles.filter(p=>p.life>0);
    }
    if (threeReady) renderThree();
    requestAnimationFrame(loop);
  }
  initThree();
  requestAnimationFrame(loop);
})();
</script>
