<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Run Rush — Mini Runner Game</title>
<style>
  :root { --ink:#f6f7fb; --muted:#aeb8d0; --panel:#141b30; --accent:#76f7c5; }
  * { box-sizing:border-box; }
  body {
    margin:0; min-height:100vh; display:grid; place-items:center; padding:20px;
    color:var(--ink); font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    background:radial-gradient(circle at 20% 0%,#263b68 0,#11172a 48%,#090d18 100%);
  }
  .wrap { width:min(920px,100%); }
  header { display:flex; justify-content:space-between; align-items:center; gap:16px; margin-bottom:14px; }
  .eyebrow { color:var(--accent); text-transform:uppercase; letter-spacing:.18em; font-size:.72rem; font-weight:800; }
  h1 { margin:4px 0 0; font-size:clamp(1.8rem,5vw,3rem); letter-spacing:-.04em; }
  .scorebox { display:flex; gap:10px; }
  .pill { background:#ffffff12; border:1px solid #ffffff20; border-radius:14px; padding:10px 14px; min-width:88px; text-align:center; }
  .pill span { display:block; font-size:.7rem; color:var(--muted); text-transform:uppercase; letter-spacing:.1em; }
  .pill strong { font-size:1.15rem; }
  .mp-panel { margin:0 0 14px; padding:16px; border:1px solid #ffffff26; border-radius:18px; background:#141b30cc; }
  .mp-top,.mp-actions,.mp-join { display:flex; align-items:center; justify-content:space-between; gap:9px; flex-wrap:wrap; }
  .mp-label { color:var(--accent); font-size:.68rem; letter-spacing:.14em; font-weight:800; margin-bottom:4px; }
  #connectionStatus { font-size:.9rem; }
  .mp-join { margin-top:12px; justify-content:flex-start; }
  .mp-panel input { min-width:0; width:130px; padding:10px 12px; border-radius:10px; border:1px solid #ffffff2a; background:#0b1224; color:white; font:inherit; }
  #roomCode { width:125px; text-transform:uppercase; letter-spacing:.12em; }
  .small-btn { padding:10px 14px; font-size:.83rem; box-shadow:none; }
  .small-btn:active { box-shadow:none; }
  .small-btn.secondary { color:var(--ink); background:#ffffff14; border:1px solid #ffffff25; }
  .small-btn:disabled { opacity:.45; cursor:not-allowed; }
  .room-info { color:var(--muted); font-size:.83rem; margin-top:10px; }
  .players-list { display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; }
  .player-chip { padding:7px 10px; border-radius:10px; background:#ffffff10; font-size:.82rem; }
  .player-chip b { color:var(--accent); }
  .game-shell { position:relative; overflow:hidden; border:1px solid #ffffff26; border-radius:22px; box-shadow:0 24px 70px #0008; background:#121d36; }
  canvas { display:block; width:100%; height:auto; aspect-ratio: 16 / 8; touch-action:manipulation; }
  .overlay { position:absolute; inset:0; display:grid; place-items:center; padding:20px; text-align:center; background:#0911269c; backdrop-filter:blur(5px); }
  .overlay.hidden { display:none; }
  .modal { max-width:420px; }
  .modal h2 { font-size:clamp(1.7rem,5vw,2.6rem); margin:0 0 8px; }
  .modal p { color:#d0d7e9; line-height:1.55; margin:0 0 18px; }
  button { border:0; cursor:pointer; font:inherit; font-weight:800; border-radius:999px; padding:12px 22px; color:#092018; background:var(--accent); box-shadow:0 7px 0 #39b98d; }
  button:active { transform:translateY(3px); box-shadow:0 4px 0 #39b98d; }
  .below { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px; padding:15px 4px 0; color:var(--muted); font-size:.9rem; }
  .jump { color:var(--ink); background:#ffffff12; border:1px solid #ffffff20; border-radius:12px; padding:9px 13px; }
  @media(max-width:520px) { body{padding:12px} header{align-items:flex-start;flex-direction:column}.scorebox{width:100%}.pill{flex:1} canvas{aspect-ratio:4/3} .below{font-size:.82rem} }
</style>
</head>
<body>
<main class="wrap">
  <header>
    <div><div class="eyebrow">A tiny arcade game</div><h1>RUN <span style="color:var(--accent)">RUSH</span></h1></div>
    <div class="scorebox">
      <div class="pill"><span>Score</span><strong id="score">0</strong></div>
      <div class="pill"><span>Best</span><strong id="best">0</strong></div>
    </div>
  </header>
  <section class="mp-panel" aria-label="Online multiplayer">
    <div class="mp-top">
      <div><div class="mp-label">ONLINE MULTIPLAYER</div><strong id="connectionStatus">Connecting…</strong></div>
      <div class="mp-actions"><input id="playerName" maxlength="16" placeholder="Your name" value="Runner" aria-label="Your player name"><button id="createRoom" class="small-btn">Create room</button></div>
    </div>
    <div class="mp-join">
      <input id="roomCode" maxlength="6" placeholder="ROOM CODE" aria-label="Room code">
      <button id="joinRoom" class="small-btn secondary">Join room</button>
      <button id="copyRoom" class="small-btn secondary" disabled>Copy invite</button>
    </div>
    <div id="roomInfo" class="room-info">Create a room and share its code with a friend.</div>
    <div id="playersList" class="players-list"></div>
  </section>
  <section class="game-shell" aria-label="Run Rush game">
    <canvas id="game" width="960" height="480" aria-label="Runner game. Tap, click, or press space to jump."></canvas>
    <div class="overlay" id="overlay">
      <div class="modal">
        <div style="font-size:3rem;margin-bottom:8px">🏃</div>
        <h2 id="overlayTitle">Ready, runner?</h2>
        <p id="overlayText">Jump over the blocks, keep running, and see how high you can score.</p>
        <button id="startBtn">Start running</button>
      </div>
    </div>
  </section>
  <div class="below">
    <span>Controls: <b>Space</b> / <b>↑</b> / tap to jump</span>
    <span class="jump">Tip: time your jumps!</span>
  </div>
</main>
<script src="/socket.io/socket.io.js"></script>
<script>
(() => {
  const socket = (typeof io === 'function') ? io() : null;
  const statusEl = document.getElementById('connectionStatus');
  const roomCodeEl = document.getElementById('roomCode');
  const nameEl = document.getElementById('playerName');
  const roomInfoEl = document.getElementById('roomInfo');
  const playersEl = document.getElementById('playersList');
  const copyBtn = document.getElementById('copyRoom');
  let activeRoom = '';
  let currentPlayers = [];
  function showStatus(text) { statusEl.textContent = text; }
  function emitRoom(action) {
    if (!socket) { showStatus('Server connection unavailable'); roomInfoEl.textContent = 'Open this game from the hosted server URL, not as a downloaded file.'; return; }
    const name = (nameEl.value.trim() || 'Runner').slice(0,16);
    socket.emit(action, { roomCode: roomCodeEl.value.trim().toUpperCase(), name });
  }
  document.getElementById('createRoom').addEventListener('click', () => emitRoom('create-room'));
  document.getElementById('joinRoom').addEventListener('click', () => emitRoom('join-room'));
  roomCodeEl.addEventListener('input', () => roomCodeEl.value = roomCodeEl.value.toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,6));
  copyBtn.addEventListener('click', async () => {
    if (!activeRoom) return;
    const invite = location.origin + location.pathname + '?room=' + activeRoom;
    try { await navigator.clipboard.writeText(invite); roomInfoEl.textContent = 'Invite link copied! Send it to your friend.'; }
    catch(e) { roomInfoEl.textContent = 'Room code: ' + activeRoom + ' — share this code with your friend.'; }
  });
  const params = new URLSearchParams(location.search);
  if (params.get('room')) roomCodeEl.value = params.get('room').toUpperCase().slice(0,6);
  if (socket) {
    socket.on('connect', () => showStatus('Connected to multiplayer server'));
    socket.on('disconnect', () => showStatus('Disconnected — reconnecting…'));
    socket.on('room-created', data => {
      activeRoom = data.roomCode; roomCodeEl.value = activeRoom; copyBtn.disabled = false;
      roomInfoEl.textContent = 'Room created! Share the code or invite link with a friend.';
    });
    socket.on('room-joined', data => {
      activeRoom = data.roomCode; roomCodeEl.value = activeRoom; copyBtn.disabled = false;
      roomInfoEl.textContent = 'Joined room ' + activeRoom + '. Start running and race your friend!';
      renderPlayers(data.players || []);
    });
    socket.on('room-update', data => {
      activeRoom = data.roomCode; renderPlayers(data.players || []);
      roomInfoEl.textContent = 'Room ' + activeRoom + ' · ' + (data.players || []).length + ' player(s) connected.';
    });
    socket.on('room-error', msg => { roomInfoEl.textContent = msg; });
    socket.on('player-state', data => {
      // Real-time rival scores/status are shown in the multiplayer roster.
      const p = currentPlayers.find(x => x.id === data.id);
      if (p) { p.score = data.score; p.alive = data.alive; renderPlayers(currentPlayers); }
    });
  }
  function renderPlayers(players) {
    currentPlayers = players;
    playersEl.innerHTML = '';
    players.forEach(p => {
      const chip = document.createElement('div'); chip.className = 'player-chip';
      const label = document.createElement('span'); label.textContent = p.name + (p.id === (socket && socket.id) ? ' (you)' : '');
      const score = document.createElement('b'); score.textContent = ' · ' + (p.score || 0) + ' pts';
      const state = document.createElement('span'); state.textContent = p.alive === false ? ' · Finished' : ' · Running';
      chip.append(label, score, state); playersEl.appendChild(chip);
    });
  }
  const reportState = (score, alive) => {
    if (socket && activeRoom) socket.emit('game-state', { roomCode: activeRoom, score: Math.floor(score), alive });
  };

  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const overlay = document.getElementById('overlay');
  const titleEl = document.getElementById('overlayTitle');
  const textEl = document.getElementById('overlayText');
  const startBtn = document.getElementById('startBtn');
  const W = canvas.width, H = canvas.height, ground = 385;
  let running = false, gameOver = false, score = 0, best = 0, speed = 6, frame = 0;
  // Scale game physics by elapsed time so different phone refresh rates play at the same speed.
  let lastTimestamp = 0, delta = 1, lastObstacleFrame = 0;
  let obstacles = [], particles = [], clouds = [];
  const player = { x:130, y:ground-58, w:42, h:58, vy:0, onGround:true };
  try { best = Number(localStorage.getItem('runrush-best') || 0); } catch(e) {}
  bestEl.textContent = best;
  for(let i=0;i<6;i++) clouds.push({x:i*190+30,y:45+Math.random()*120,s:.65+Math.random()*.8});
  function reset() {
    score=0; speed=6; frame=0; lastObstacleFrame=0; obstacles=[]; particles=[];
    player.y=ground-player.h; player.vy=0; player.onGround=true;
    scoreEl.textContent='0'; gameOver=false; running=true; overlay.classList.add('hidden');
  }
  function jump() {
    if (!running) { if (!gameOver) reset(); else reset(); return; }
    if (player.onGround) { player.vy=-15.5; player.onGround=false; burst(player.x+20,player.y+player.h,7); }
  }
  startBtn.addEventListener('click', reset);
  canvas.addEventListener('pointerdown', e => { e.preventDefault(); jump(); });
  document.addEventListener('keydown', e => {
    if (['Space','ArrowUp','KeyW'].includes(e.code)) { e.preventDefault(); if(e.repeat)return; if(!running) { if(gameOver) reset(); else reset(); } else jump(); }
  });
  function burst(x,y,n) { for(let i=0;i<n;i++) particles.push({x,y,vx:(Math.random()-.5)*4,vy:-Math.random()*3,life:20+Math.random()*10}); }
  function endGame() {
    running=false; gameOver=true; reportState(score,false); best=Math.max(best,Math.floor(score));
    bestEl.textContent=best;
    try { localStorage.setItem('runrush-best',best); } catch(e) {}
    titleEl.textContent='Run over!';
    textEl.textContent=`You scored ${Math.floor(score)} points. Ready for another run?`;
    startBtn.textContent='Run again';
    overlay.classList.remove('hidden');
  }
  function roundedRect(x,y,w,h,r,color) {
    ctx.fillStyle=color; ctx.beginPath(); ctx.roundRect(x,y,w,h,r); ctx.fill();
  }
  function drawBackground() {
    const g=ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'#1c3157'); g.addColorStop(1,'#182342');
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#ffe5a6'; ctx.beginPath(); ctx.arc(780,95,34,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#ffffff18';
    for(const c of clouds) {
      ctx.beginPath(); ctx.ellipse(c.x,c.y,34*c.s,13*c.s,0,0,Math.PI*2); ctx.ellipse(c.x+22*c.s,c.y-7*c.s,22*c.s,17*c.s,0,0,Math.PI*2); ctx.ellipse(c.x+42*c.s,c.y,27*c.s,12*c.s,0,0,Math.PI*2); ctx.fill();
      if(running)c.x-=speed*.18*c.s*delta;
      if(c.x < -90)c.x=W+50;
    }
    // distant hills
    ctx.fillStyle='#253d62'; ctx.beginPath(); ctx.moveTo(0,ground);
    for(let x=0;x<=W;x+=80) ctx.lineTo(x,300+Math.sin(x*.012+frame*.003)*26);
    ctx.lineTo(W,ground);ctx.closePath();ctx.fill();
    ctx.fillStyle='#172d3b';ctx.fillRect(0,ground,W,H-ground);
    ctx.fillStyle='#76f7c5';ctx.fillRect(0,ground,W,5);
    ctx.fillStyle='#ffffff24';
    for(let x=-(frame*speed*.7)%90;x<W;x+=90) ctx.fillRect(x,ground+45,42,4);
  }
  function drawPlayer() {
    const bob=player.onGround && running ? Math.sin(frame*.35)*2 : 0;
    // shadow
    ctx.fillStyle='#0004';ctx.beginPath();ctx.ellipse(player.x+22,ground+3,28,7,0,0,Math.PI*2);ctx.fill();
    roundedRect(player.x,player.y+bob,player.w,player.h,12,'#76f7c5');
    roundedRect(player.x+7,player.y+9+bob,28,22,8,'#143b45');
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(player.x+28,player.y+19+bob,4,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#143b45';ctx.beginPath();ctx.arc(player.x+29,player.y+19+bob,2,0,Math.PI*2);ctx.fill();
    // legs
    ctx.strokeStyle='#76f7c5';ctx.lineWidth=8;ctx.lineCap='round';
    const swing=player.onGround && running ? Math.sin(frame*.4)*8 : -4;
    ctx.beginPath();ctx.moveTo(player.x+12,player.y+player.h-3+bob);ctx.lineTo(player.x+9+swing,player.y+player.h+7+bob);ctx.moveTo(player.x+31,player.y+player.h-3+bob);ctx.lineTo(player.x+32-swing,player.y+player.h+7+bob);ctx.stroke();
  }
  function spawnObstacle() {
    const h=34+Math.random()*30, w=28+Math.random()*20;
    obstacles.push({x:W+20,y:ground-h,w,h});
  }
  function drawObstacle(o) {
    roundedRect(o.x,o.y,o.w,o.h,7,'#ff7b72');
    roundedRect(o.x+5,o.y+7,o.w-10,5,3,'#ffc0a9');
    ctx.fillStyle='#d64d60';ctx.fillRect(o.x+4,o.y+o.h-7,o.w-8,7);
  }
  function loop(timestamp = 0) {
    // delta=1 is one 60 Hz frame. Cap large gaps (e.g. switching tabs) to avoid sudden jumps.
    delta = lastTimestamp ? Math.min((timestamp - lastTimestamp) / (1000 / 60), 2) : 1;
    lastTimestamp = timestamp;
    drawBackground();
    if(running) {
      frame += delta;
      score += .12 * delta;
      speed=Math.min(12,6+score/150);
      scoreEl.textContent=Math.floor(score);
      if(Math.floor(frame / 6) !== Math.floor((frame-delta) / 6)) reportState(score,true);
      player.vy += .72 * delta;
      player.y += player.vy * delta;
      if(player.y >= ground-player.h) { player.y=ground-player.h; player.vy=0; player.onGround=true; }
      const spawnEvery = Math.max(42,Math.floor(95-speed*3));
      if(frame - lastObstacleFrame >= spawnEvery) { spawnObstacle(); lastObstacleFrame = frame; }
      obstacles.forEach(o=>o.x-=speed*delta);
      obstacles=obstacles.filter(o=>o.x+o.w>-10);
      for(const o of obstacles) {
        if(player.x+player.w-7>o.x && player.x+7<o.x+o.w && player.y+player.h-4>o.y) { endGame(); break; }
      }
      particles.forEach(p=>{p.x+=p.vx*delta;p.y+=p.vy*delta;p.vy+=.12*delta;p.life-=delta;});
      particles=particles.filter(p=>p.life>0);
    }
    obstacles.forEach(drawObstacle);
    particles.forEach(p=>{ctx.globalAlpha=Math.max(0,p.life/25);ctx.fillStyle='#76f7c5';ctx.fillRect(p.x,p.y,4,4);ctx.globalAlpha=1;});
    drawPlayer();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
